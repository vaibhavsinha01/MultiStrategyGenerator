<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simurgh Capital - Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body{
      height:100%;
    }

    body{
      display:flex;
      color:white;
    }

    /* ---------- Left: image panel ---------- */
    .visual-panel{
      position:relative;
      flex:1 1 50%;
      min-height:100vh;
      background-image: url("/images/nature_Imagery2.jpg");
      background-size:cover;
      background-position:center;
    }

    .visual-panel::after{
      content:"";
      position:absolute;
      inset:0;
      /* subtle scrim only at the bottom so the wordmark stays readable
         without covering the photo */
      background: linear-gradient(0deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 25%, rgba(0,0,0,0) 45%);
    }

    .visual-brand{
      position:absolute;
      left:40px;
      bottom:36px;
      z-index:1;
    }

    .visual-brand .wordmark{
      font-size:22px;
      font-weight:bold;
      letter-spacing:2px;
    }

    .visual-brand .tagline{
      margin-top:6px;
      font-size:13px;
      color:#dbe4ff;
      max-width:320px;
      line-height:1.4;
    }

    /* ---------- Right: form panel ---------- */
    .form-panel{
      flex:1 1 50%;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#ffffff;
      padding:40px;
      color:#0f172a;
    }

    .container{
      width:100%;
      max-width:380px;
    }

    .logo{
      text-align:center;
      margin-bottom:6px;
      font-size:32px;
      font-weight:bold;
      letter-spacing:1px;
      color:#1e6fd9;
    }

    .subtitle{
      text-align:center;
      color:#8a94a6;
      margin-bottom:32px;
      font-size:14px;
    }

    .input-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-size:13px;
      color:#4b5768;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:13px 16px;
      border:1.5px solid #cfe0f7;
      outline:none;
      border-radius:24px;
      background:#ffffff;
      color:#0f172a;
      font-size:15px;
      transition:border-color 0.2s;
    }

    input::placeholder{
      color:#a6b1c2;
    }

    input:focus{
      border-color:#1e6fd9;
    }

    .forgot{
      text-align:right;
      margin-top:8px;
    }

    .forgot a{
      font-size:12.5px;
      color:#8a94a6;
      text-decoration:none;
    }

    .forgot a:hover{
      color:#1e6fd9;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:24px;
      background:#1e6fd9;
      color:white;
      font-weight:bold;
      font-size:15px;
      cursor:pointer;
      transition:0.3s;
      margin-top:14px;
    }

    button:hover{
      background:#1a5fbf;
      transform:translateY(-2px);
    }

    .divider{
      display:flex;
      align-items:center;
      gap:14px;
      margin:26px 0;
    }

    .divider .line{
      flex:1;
      height:1px;
      background:#e3e9f2;
    }

    .divider span{
      font-size:12px;
      color:#a6b1c2;
      letter-spacing:1px;
    }

    .google-btn{
      width:100%;
      padding:12px;
      border-radius:24px;
      border:1.5px solid #e3e9f2;
      background:#ffffff;
      color:#333;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition:0.2s;
      margin-top:0;
      text-decoration:none;
    }

    .google-btn:hover{
      background:#f6f9fe;
      border-color:#cfe0f7;
      transform:translateY(-2px);
    }

    .google-btn svg{
      width:18px;
      height:18px;
      flex-shrink:0;
    }

    .footer{
      margin-top:26px;
      text-align:center;
      font-size:14px;
      color:#8a94a6;
    }

    .footer a{
      color:#1e6fd9;
      text-decoration:none;
      font-weight:bold;
    }

    /* ---------- Responsive: stack on small screens ---------- */
    @media (max-width: 900px){
      body{
        flex-direction:column;
      }

      .visual-panel{
        flex:none;
        min-height:35vh;
      }

      .form-panel{
        flex:none;
        min-height:65vh;
        padding:32px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="visual-panel">
    <div class="visual-brand">
      <div class="wordmark">SIMURGH CAPITAL</div>
      <div class="tagline">Strategy Generation Platform</div>
    </div>
  </div>

  <div class="form-panel">
    <div class="container">
      <div class="logo">Welcome</div>
      <div class="subtitle">Login to Simurgh Capital</div>

      <form id="loginForm" method="post" action="/auth/login">
        <div class="input-group">
          <label>Email</label>
          <input id="email" name="email" type="email" placeholder="Enter your email" required />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />
          <div class="forgot">
            <a href="/forgot-password">Forgot your password?</a>
          </div>
        </div>

        <button type="submit">Login</button>
      </form>

      <div class="divider">
        <div class="line"></div>
        <span>OR</span>
        <div class="line"></div>
      </div>

      <a href="/auth/google" class="google-btn">
        <svg viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12
            c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24
            c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039
            l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36
            c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571
            c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24
            C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        Continue with Google
      </a>

      <div class="footer">
        Don't have an account?
        <a href="/signup">Register Now</a>
      </div>
    </div>
  </div>

  <script>
    // Keep this page fully static; the server handles auth and redirects.
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (error === "invalid_credentials") {
      alert("Invalid email or password.");
    } else if (error === "google_denied") {
      alert("Google sign-in was cancelled.");
    } else if (error === "google_failed" || error === "google_state" || error === "google_config") {
      alert("Google sign-in failed. Check OAuth redirect URI: /auth/google/callback");
    }

    // Google Sign-In placeholder.
    // The .google-btn link currently points to /auth/google — point this at
    // whatever route kicks off your OAuth flow once it's configured
    // (e.g. Google Identity Services, or a server-side redirect via
    // auth_db.py / a dedicated /auth/google route).
  </script>

</body>
</html>
