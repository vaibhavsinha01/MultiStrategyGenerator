<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simurgh Capital - Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      background: linear-gradient(135deg,#050816,#0c1224,#111827);
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      width:400px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius:18px;
      padding:40px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .logo{
      text-align:center;
      margin-bottom:10px;
      font-size:30px;
      font-weight:bold;
      letter-spacing:2px;
    }

    .subtitle{
      text-align:center;
      color:#b9c2d0;
      margin-bottom:35px;
      font-size:14px;
    }

    .input-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      color:#d6dce8;
    }

    input{
      width:100%;
      padding:14px;
      border:none;
      outline:none;
      border-radius:10px;
      background:#1b2436;
      color:white;
      font-size:15px;
    }

    input::placeholder{
      color:#94a3b8;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:white;
      color:#0b1120;
      font-weight:bold;
      font-size:15px;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
    }

    button:hover{
      background:#dbe4ff;
      transform:translateY(-2px);
    }

    .footer{
      margin-top:25px;
      text-align:center;
      font-size:14px;
      color:#aeb8c7;
    }

    .footer a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">SIMURGH CAPITAL</div>
    <div class="subtitle">Strategy Generation Platform</div>

    <form id="loginForm" method="post" action="/auth/login">
      <div class="input-group">
        <label>Email</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required />
      </div>

      <button type="submit">Login</button>
    </form>

    <div class="footer">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </div>
  </div>

  <script>
    // Keep this page fully static; the server handles auth and redirects.
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (error === "invalid_credentials") {
      alert("Invalid email or password.");
    }
  </script>

</body>
</html>
