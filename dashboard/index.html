
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategy Report</title>

  <!-- Google AdSense -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7746104363235696"
    crossorigin="anonymous">
  </script>

  <style>
    :root {
      --bg: #07111f;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d8dde6;
      --accent: #38bdf8;
      --accent-2: #c84b31;
      --good: #0f7a4d;
      --bad: #b42318;
      --warn: #9a6700;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      background: #050b14;
      color: #fff;
      padding: 24px 28px 18px;
      border-bottom: 4px solid var(--accent);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 760;
    }

    .subtitle {
      margin-top: 8px;
      color: #cfd6df;
      font-size: 14px;
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 20px 36px;
    }

    .probability-band {
      display: grid;
      grid-template-columns: 96px minmax(160px, 1fr) 96px;
      gap: 10px;
      align-items: center;
      background: #0b1627;
      border: 1px solid #1e324d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      color: #eef7ff;
    }

    .probability-track {
      height: 18px;
      display: flex;
      overflow: hidden;
      border-radius: 5px;
      background: #172235;
      border: 1px solid #263a59;
    }

    .buy-fill {
      background: #22c55e;
      min-width: 2%;
    }

    .sell-fill {
      background: #ef4444;
      min-width: 2%;
    }

    .probability-label {
      font-size: 13px;
      font-weight: 800;
    }

    .chat-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 44px;
      height: 44px;
      border: 1px solid #38bdf8;
      background: #0b1627;
      color: #e8f7ff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      z-index: 5;
    }

    .chat-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(360px, 94vw);
      height: 100vh;
      background: #08111f;
      color: #e8f7ff;
      border-left: 1px solid #203651;
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 6;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .chat-panel.open {
      transform: translateX(0);
    }

    .chat-head,
    .chat-form {
      padding: 12px;
      border-bottom: 1px solid #203651;
    }

    .chat-form {
      border-top: 1px solid #203651;
      border-bottom: 0;
      display: grid;
      grid-template-columns: 1fr 72px;
      gap: 8px;
    }

    .chat-body {
      padding: 12px;
      overflow: auto;
      font-size: 14px;
      line-height: 1.45;
    }

    .chat-form input {
      min-height: 38px;
      border-radius: 6px;
      border: 1px solid #29415e;
      background: #fff;
      color: #101828;
      padding: 8px 10px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      align-items: end;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      font-size: 14px;
    }

    .doc-button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      min-height: 34px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .doc-button:hover {
      background: #0d5254;
    }

    .status {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 650;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 22px;
      line-height: 1.1;
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1240px;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 9px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: right;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: #eef2f5;
      color: #344054;
      z-index: 1;
      font-size: 12px;
      text-transform: uppercase;
    }

    td:first-child,
    th:first-child,
    td:nth-child(2),
    th:nth-child(2),
    td:nth-child(3),
    th:nth-child(3) {
      text-align: left;
    }

    tbody tr:hover {
      background: #f9fbfc;
    }

    .signals {
      max-width: 190px;
      white-space: normal;
      line-height: 1.35;
    }

    .positive {
      color: var(--good);
      font-weight: 700;
    }

    .negative {
      color: var(--bad);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .regime-cell {
      min-width: 158px;
      white-space: normal;
      text-align: left;
      line-height: 1.4;
    }

    .regime-name {
      display: inline-block;
      min-width: 58px;
      color: #344054;
      font-weight: 700;
    }

    .empty {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
    }

    .ad-container {
      max-width: 1440px;
      margin: 16px auto;
      padding: 0;
      background: transparent;
      border: none;
      min-height: 90px;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      .controls,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px;">
      <div>
        <h1>Strategy Report</h1>
        <div class="subtitle">
          Top strategy results by symbol, timeframe, and market regime
        </div>
      </div>

      <div style="padding-bottom:6px;">
        <a href="/logout" style="color:#cfd6df; text-decoration:none; font-weight:700;">
          Logout
        </a>
      </div>
    </div>
  </header>

  <!-- AdSense Banner AFTER HEADER -->
  <section class="ad-container">
    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-7746104363235696"
      data-ad-slot="1234567890"
      data-ad-format="auto"
      data-full-width-responsive="true">
    </ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </section>

  <main>

    <section class="controls" aria-label="Report filters">
      <label>
        Symbol
        <select id="symbol"></select>
      </label>

      <label>
        Timeframe
        <select id="timeframe"></select>
      </label>

      <label>
        Dataset
        <select id="dataset">
          <option value="validated">Validated</option>
          <option value="train">Train</option>
        </select>
      </label>

      <label>
        Rows
        <select id="limit">
          <option value="100">Top 100</option>
          <option value="500">Top 500</option>
          <option value="1000">Top 1000</option>
        </select>
      </label>
    </section>

    <section class="probability-band" id="probabilityBand">
      <div class="probability-label" id="buyProbability">BUY --%</div>
      <div class="probability-track">
        <div class="buy-fill" id="buyFill" style="width:50%"></div>
        <div class="sell-fill" id="sellFill" style="width:50%"></div>
      </div>
      <div class="probability-label" id="sellProbability">SELL --%</div>
    </section>

    <section class="status" id="status"></section>

    <section class="summary-grid" id="summary"></section>

    <section id="report"></section>

  </main>

  <button class="chat-toggle" id="chatToggle" title="Chat">?</button>
  <aside class="chat-panel" id="chatPanel">
    <div class="chat-head">
      <strong>Signal Chat</strong>
      <button class="doc-button" id="chatClose" style="float:right; min-height:28px;">Close</button>
    </div>
    <div class="chat-body" id="chatBody">
      Ask about probabilities, signals, validation, or risk.
    </div>
    <form class="chat-form" id="chatForm">
      <input id="chatInput" autocomplete="off" placeholder="Ask about risk..." />
      <button class="doc-button" type="submit">Send</button>
    </form>
  </aside>

  <script>
    const els = {
      symbol: document.querySelector("#symbol"),
      timeframe: document.querySelector("#timeframe"),
      dataset: document.querySelector("#dataset"),
      limit: document.querySelector("#limit"),
      status: document.querySelector("#status"),
      summary: document.querySelector("#summary"),
      report: document.querySelector("#report"),
      buyProbability: document.querySelector("#buyProbability"),
      sellProbability: document.querySelector("#sellProbability"),
      buyFill: document.querySelector("#buyFill"),
      sellFill: document.querySelector("#sellFill"),
      chatToggle: document.querySelector("#chatToggle"),
      chatPanel: document.querySelector("#chatPanel"),
      chatClose: document.querySelector("#chatClose"),
      chatForm: document.querySelector("#chatForm"),
      chatInput: document.querySelector("#chatInput"),
      chatBody: document.querySelector("#chatBody"),
    };

    let options = null;

    const fmt = {
      pct: (value) => `${Number(value || 0).toFixed(2)}%`,
      num: (value) => Number(value || 0).toLocaleString(),
      dec: (value, places = 2) => Number(value || 0).toFixed(places),
    };

    function classFor(value) {
      const number = Number(value || 0);

      if (number > 0) return "positive";
      if (number < 0) return "negative";

      return "muted";
    }

    function setSelect(select, values, selected) {
      select.innerHTML = values.map((value) => (
        `<option value="${value}" ${value === selected ? "selected" : ""}>${value.toUpperCase()}</option>`
      )).join("");
    }

    function updateTimeframes() {
      const symbol = els.symbol.value;
      const timeframes = (options.timeframesBySymbol[symbol] || [])
        .filter((timeframe) => !["1m", "5m"].includes(timeframe.toLowerCase()));
      const preferred = timeframes.includes("15m") ? "15m" : timeframes[0];

      setSelect(
        els.timeframe,
        timeframes,
        els.timeframe.value || preferred
      );
    }

    function metricCard(label, value, klass = "") {
      return `
        <div class="metric">
          <span>${label}</span>
          <strong class="${klass}">${value}</strong>
        </div>
      `;
    }

    async function loadReport() {
      const params = new URLSearchParams({
        symbol: els.symbol.value,
        timeframe: els.timeframe.value,
        dataset: els.dataset.value,
        limit: els.limit.value,
      });

      els.status.innerHTML = `<span class="pill">Loading report</span>`;

      const response = await fetch(`/api/report?${params}`);
      const data = await response.json();

      if (!data.available) {
        els.report.innerHTML = `
          <div class="empty">
            No generated strategy report exists for this selection yet.
          </div>
        `;

        return;
      }

      const best = data.top[0];

      els.status.innerHTML = `
        <span class="pill">${data.symbol.toUpperCase()}</span>
        <span class="pill">${data.timeframe.toUpperCase()}</span>
        <span class="pill">${data.dataset}</span>
      `;

      els.summary.innerHTML = [
        metricCard("Strategies", fmt.num(data.totalStrategies)),
        metricCard("Best Test Return", fmt.pct(best.test.returnPct), classFor(best.test.returnPct)),
        metricCard("Best Train Return", fmt.pct(best.train.returnPct), classFor(best.train.returnPct)),
        metricCard("Best Trades", fmt.num(best.test.trades)),
        metricCard("Best Score", fmt.dec(best.score, 5)),
      ].join("");

      const rows = data.top.map((strategy) => `
        <tr>
          <td>#${strategy.rank}</td>
          <td>
            <strong>${strategy.id}</strong><br>
            <span class="muted">${strategy.direction}</span>
          </td>
          <td class="signals">${strategy.signals}</td>
          <td>${fmt.pct(strategy.train.returnPct)}</td>
          <td>${fmt.dec(strategy.train.sharpe)}</td>
          <td>${strategy.train.trades}</td>
          <td>${fmt.pct(strategy.test.returnPct)}</td>
          <td>${fmt.dec(strategy.test.sharpe)}</td>
          <td>${strategy.test.trades}</td>
          <td>
            <button class="doc-button doc-export" data-strategy-id="${strategy.id}">Document</button>
          </td>
        </tr>
      `).join("");

      els.report.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Strategy</th>
                <th>Signals</th>
                <th>Train Return</th>
                <th>Train Sharpe</th>
                <th>Train Trades</th>
                <th>Test Return</th>
                <th>Test Sharpe</th>
                <th>Test Trades</th>
                <th>Export</th>
              </tr>
            </thead>

            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>
      `;
      loadPrediction();
    }

    async function loadPrediction() {
      const params = new URLSearchParams({
        symbol: els.symbol.value,
        timeframe: els.timeframe.value,
      });
      try {
        const response = await fetch(`/api/prediction?${params}`);
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || "Prediction unavailable");
        const buy = Number(data.buy_probability);
        const sell = Number(data.sell_probability);
        els.buyProbability.textContent = `BUY ${buy.toFixed(2)}%`;
        els.sellProbability.textContent = `SELL ${sell.toFixed(2)}%`;
        els.buyFill.style.width = `${Math.max(2, buy)}%`;
        els.sellFill.style.width = `${Math.max(2, sell)}%`;
      } catch (error) {
        els.buyProbability.textContent = "BUY n/a";
        els.sellProbability.textContent = "SELL n/a";
      }
    }

    async function init() {
      const response = await fetch("/api/options");
      options = await response.json();

      const initialSymbol = options.symbols.includes("ethusd")
        ? "ethusd"
        : options.symbols[0];

      setSelect(els.symbol, options.symbols, initialSymbol);

      updateTimeframes();

      await loadReport();
    }

    els.symbol.addEventListener("change", () => {
      updateTimeframes();
      loadReport();
    });

    els.timeframe.addEventListener("change", loadReport);
    els.dataset.addEventListener("change", loadReport);
    els.limit.addEventListener("change", loadReport);
    els.report.addEventListener("click", (event) => {
      const button = event.target.closest(".doc-export");
      if (!button) return;
      const params = new URLSearchParams({
        symbol: els.symbol.value,
        timeframe: els.timeframe.value,
        dataset: els.dataset.value,
        strategyId: button.dataset.strategyId,
      });
      window.location.href = `/api/document?${params}`;
    });
    els.chatToggle.addEventListener("click", () => els.chatPanel.classList.add("open"));
    els.chatClose.addEventListener("click", () => els.chatPanel.classList.remove("open"));
    els.chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = els.chatInput.value.trim();
      if (!message) return;
      els.chatBody.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
      els.chatInput.value = "";
      try {
        const response = await fetch("/api/chatbot", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            message,
            symbol: els.symbol.value,
            timeframe: els.timeframe.value,
          }),
        });
        const data = await response.json();
        els.chatBody.innerHTML += `<p><strong>Chat:</strong> ${data.answer || data.error || "No response."}</p>`;
      } catch (error) {
        els.chatBody.innerHTML += `<p><strong>Chat:</strong> Could not reach the signal chat endpoint.</p>`;
      }
      els.chatBody.scrollTop = els.chatBody.scrollHeight;
    });

    setInterval(loadPrediction, 60000);

    init().catch((error) => {
      els.status.innerHTML = `
        <span class="pill">Could not load report</span>
      `;

      els.report.innerHTML = `
        <div class="empty">${error.message}</div>
      `;
    });
  </script>

</body>
</html>
