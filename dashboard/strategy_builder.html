<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strategy Factory</title>
<style>body{font:14px system-ui,sans-serif;background:#f6f8fb;color:#142033;margin:0}.nav,main{max-width:1180px;margin:auto;padding:18px 24px}.nav{display:flex;justify-content:space-between;background:#fff;max-width:none}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin:18px 0}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:6px}select,button{padding:9px 12px;border-radius:7px;border:1px solid #cbd5e1}button{background:#1366d9;color:#fff;border:0;font-weight:650;cursor:pointer}.signal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px;max-height:540px;overflow:auto}.signal{padding:7px;border:1px solid #e2e8f0;border-radius:6px}.muted{color:#64748b}.status{min-height:20px;font-weight:600}</style></head>
<body><nav class="nav"><strong>Simurgh Trading · Strategy Factory</strong><a href="/app">Back to reports</a></nav><main>
<h1>Generate strategies</h1><p class="muted">All signals are selected by default. Uncheck any signal to remove it from the generator, backtester, regime-validation, and evaluator run. Each candidate remains a 2–5 signal strategy.</p>
<section class="card"><div class="controls"><label class="field">Count<select id="count"><option>50</option><option>100</option><option>500</option></select></label><label class="field">Symbol<select id="symbol"></select></label><label class="field">Timeframe<select id="timeframe"></select></label><button id="selectAll">Select all</button><button id="clearAll">Clear all</button><button id="generate">Generate & evaluate</button></div></section>
<section class="card"><div><strong>Signals</strong> <span class="muted" id="selectedCount"></span></div><div class="signal-grid" id="signals"></div></section><p class="status" id="status"></p>
</main><script>
const els={signals:document.querySelector('#signals'),selected:document.querySelector('#selectedCount'),count:document.querySelector('#count'),symbol:document.querySelector('#symbol'),timeframe:document.querySelector('#timeframe'),status:document.querySelector('#status')};let options;
function updateCount(){els.selected.textContent=`${document.querySelectorAll('.signal input:checked').length} selected`;}
function updateTimeframes(){const values=options.timeframesBySymbol[els.symbol.value]||[];els.timeframe.innerHTML=values.map(x=>`<option>${x}</option>`).join('');}
async function init(){const [signalRes,optRes]=await Promise.all([fetch('/api/signals'),fetch('/api/options')]);const data=await signalRes.json();options=await optRes.json();els.symbol.innerHTML=options.symbols.map(x=>`<option>${x}</option>`).join('');updateTimeframes();els.signals.innerHTML=data.signals.map(s=>`<label class="signal"><input type="checkbox" checked value="${s.id}"> <b>${s.id}</b> · ${s.description} <small class="muted">${s.group}</small></label>`).join('');els.signals.addEventListener('change',updateCount);els.symbol.addEventListener('change',updateTimeframes);updateCount();}
document.querySelector('#selectAll').onclick=()=>{document.querySelectorAll('.signal input').forEach(x=>x.checked=true);updateCount()};document.querySelector('#clearAll').onclick=()=>{document.querySelectorAll('.signal input').forEach(x=>x.checked=false);updateCount()};
document.querySelector('#generate').onclick=async()=>{const signals=[...document.querySelectorAll('.signal input:checked')].map(x=>x.value);if(!signals.length){els.status.textContent='Select at least one signal.';return}els.status.textContent='Starting full generation pipeline…';const r=await fetch('/api/strategy-generation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({count:+els.count.value,signals,symbol:els.symbol.value,timeframe:els.timeframe.value})});const job=await r.json();if(!r.ok){els.status.textContent=job.error;return}const timer=setInterval(async()=>{const state=await (await fetch(`/api/strategy-generation/${job.id}`)).json();els.status.textContent=`Generation ${state.status}…`;if(state.status!=='running'){clearInterval(timer);els.status.textContent=state.status==='completed'?`Completed: ${state.result.savedCount} evaluated strategies saved. View them in My strategies.`:`Failed: ${state.error}`;}},2500);};init();
</script></body></html>
