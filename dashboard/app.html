<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategy Report — Simurgh Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card: #ffffff;
      --ink: #0b1220;
      --muted: #64748b;
      --line: rgba(15, 23, 42, 0.08);
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 8px 24px rgba(15, 23, 42, 0.06);
      --radius: 22px;
      --blue: #2563eb;
      --blue-soft: rgba(37, 99, 235, 0.08);
      --green: #059669;
      --green-soft: rgba(5, 150, 105, 0.1);
      --red: #dc2626;
      --red-soft: rgba(220, 38, 38, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 80% 0%, rgba(37,99,235,0.10), transparent 55%),
        var(--bg);
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(12px);
      background: rgba(248, 250, 252, 0.85);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .logo {
      width: 34px; height: 34px; border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      box-shadow: 0 8px 18px rgba(37,99,235,0.22);
    }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 13px;
      border: 1px solid var(--line); background: #fff; cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: #fff; border: 0;
      box-shadow: 0 12px 28px rgba(37,99,235,0.22);
    }

    main { padding: 32px 0 56px; }
    .page-head { margin-bottom: 24px; }
    .page-head h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -0.02em; }
    .page-head p { margin: 0; color: var(--muted); font-size: 15px; }

    .filters-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 22px 24px;
      margin-bottom: 24px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .filters-card:hover { box-shadow: var(--shadow); }
    .filters-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .field label {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;
    }
    .field select {
      width: 100%; min-height: 44px; padding: 10px 14px;
      border-radius: 14px; border: 1px solid var(--line);
      background: #fff; font-size: 14px; font-weight: 600; color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field select:focus {
      outline: none; border-color: rgba(37,99,235,0.45);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .status { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .pill {
      padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
      background: #fff; border: 1px solid var(--line); color: var(--muted);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .metric {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .metric:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .metric-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .metric-top span {
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .metric-icon {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--blue-soft); color: var(--blue);
      display: grid; place-items: center; font-size: 14px;
    }
    .metric strong { font-size: 26px; letter-spacing: -0.02em; line-height: 1.1; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .muted { color: var(--muted); }

    .table-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      position: relative;
    }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1200px; font-size: 13px; }
    thead th {
      position: sticky; top: 0; z-index: 2;
      background: #f1f5f9; color: #475569;
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 14px 12px; text-align: right; border-bottom: 1px solid var(--line);
    }
    tbody td {
      padding: 14px 12px; text-align: right; border-bottom: 1px solid rgba(15,23,42,0.05);
      vertical-align: middle;
    }
    tbody tr:nth-child(even) { background: rgba(248,250,252,0.7); }
    tbody tr { transition: background 0.15s ease; }
    tbody tr:hover { background: rgba(37,99,235,0.04); }
    td:first-child, th:first-child,
    td:nth-child(2), th:nth-child(2),
    td:nth-child(3), th:nth-child(3) { text-align: left; }
    .signals { max-width: 220px; white-space: normal; line-height: 1.45; color: #334155; }
    .strategy-id { font-weight: 800; font-size: 14px; }
    .badge {
      display: inline-flex; align-items: center; padding: 5px 10px;
      border-radius: 999px; font-size: 11px; font-weight: 800; text-transform: uppercase;
    }
    .badge-bull { background: var(--green-soft); color: var(--green); }
    .badge-bear { background: var(--red-soft); color: var(--red); }

    .export-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .action-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: 700;
      border: 1px solid var(--line); background: #fff; cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .action-btn:hover { transform: translateY(-1px); border-color: rgba(37,99,235,0.25); background: var(--blue-soft); }
    .action-btn.code { color: var(--blue); }

    .empty {
      padding: 40px 24px; text-align: center; color: var(--muted); font-size: 15px;
    }
    .report-loading-overlay {
      position: absolute; inset: 0; background: rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center; z-index: 5;
      backdrop-filter: blur(3px);
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid rgba(37,99,235,0.15);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade-up {
      opacity: 0; transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }

    @media (max-width: 1024px) {
      .filters-grid { grid-template-columns: 1fr 1fr; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .filters-grid, .metrics { grid-template-columns: 1fr; }
      .page-head h1 { font-size: 26px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="container nav-inner">
      <a href="/" class="brand">
        <div class="logo"></div>
        <span>Simurgh Capital</span>
      </a>
      <div class="nav-actions">
        <a class="btn" href="/">Home</a>
        <a class="btn" href="/document">Docs</a>
        <a class="btn" href="/logout">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-head fade-up">
      <h1>Strategy Report</h1>
      <p>Top strategy results by symbol, timeframe, and validation dataset.</p>
    </div>

    <section class="filters-card fade-up delay-1" aria-label="Report filters">
      <div class="filters-grid">
        <div class="field">
          <label><span>◎</span> Symbol</label>
          <select id="symbol"></select>
        </div>
        <div class="field">
          <label><span>⏱</span> Timeframe</label>
          <select id="timeframe"></select>
        </div>
        <div class="field">
          <label><span>✓</span> Dataset</label>
          <select id="dataset">
            <option value="validated">Validated</option>
            <option value="train">Train</option>
          </select>
        </div>
        <div class="field">
          <label><span>#</span> Rows</label>
          <select id="limit">
            <option value="100">Top 100</option>
            <option value="500">Top 500</option>
            <option value="1000">Top 1000</option>
          </select>
        </div>
      </div>
    </section>

    <section class="status fade-up delay-2" id="status"></section>
    <section class="metrics fade-up delay-2" id="summary"></section>
    <section class="table-card fade-up delay-3" id="report"></section>
  </main>

  <script>
    const els = {
      symbol: document.querySelector("#symbol"),
      timeframe: document.querySelector("#timeframe"),
      dataset: document.querySelector("#dataset"),
      limit: document.querySelector("#limit"),
      status: document.querySelector("#status"),
      summary: document.querySelector("#summary"),
      report: document.querySelector("#report"),
    };

    let options = null;

    const fmt = {
      pct: (v) => `${Number(v || 0).toFixed(2)}%`,
      num: (v) => Number(v || 0).toLocaleString(),
      dec: (v, p = 2) => Number(v || 0).toFixed(p),
    };

    function classFor(v) {
      const n = Number(v || 0);
      if (n > 0) return "positive";
      if (n < 0) return "negative";
      return "muted";
    }

    function directionBadge(dir) {
      const d = (dir || "").toLowerCase();
      if (d === "bull") return `<span class="badge badge-bull">Bull</span>`;
      if (d === "bear") return `<span class="badge badge-bear">Bear</span>`;
      return `<span class="badge">${dir || "—"}</span>`;
    }

    function setSelect(select, values, selected) {
      select.innerHTML = values.map((v) =>
        `<option value="${v}" ${v === selected ? "selected" : ""}>${v.toUpperCase()}</option>`
      ).join("");
    }

    function updateTimeframes() {
      const symbol = els.symbol.value;
      const timeframes = (options.timeframesBySymbol[symbol] || [])
        .filter((tf) => !["1m", "5m"].includes(tf.toLowerCase()));
      const preferred = timeframes.includes("15m") ? "15m" : timeframes[0];
      setSelect(els.timeframe, timeframes, els.timeframe.value || preferred);
    }

    const metricIcons = ["📊", "📈", "🎯", "⚡", "★"];

    function metricCard(label, value, klass = "", icon = "📊") {
      return `
        <div class="metric">
          <div class="metric-top">
            <span>${label}</span>
            <div class="metric-icon">${icon}</div>
          </div>
          <strong class="${klass}">${value}</strong>
        </div>
      `;
    }

    async function loadReport() {
      const params = new URLSearchParams({
        symbol: els.symbol.value,
        timeframe: els.timeframe.value,
        dataset: els.dataset.value,
        limit: els.limit.value,
      });

      els.status.innerHTML = `<span class="pill">Loading report…</span>`;
      els.report.innerHTML = `<div class="report-loading-overlay"><div class="spinner"></div></div>`;

      const response = await fetch(`/api/report?${params}`);
      const data = await response.json();

      if (!data.available) {
        els.status.innerHTML = "";
        els.summary.innerHTML = "";
        els.report.innerHTML = `<div class="empty">No generated strategy report exists for this selection yet.</div>`;
        return;
      }

      const best = data.top[0];
      els.status.innerHTML = `
        <span class="pill">${data.symbol.toUpperCase()}</span>
        <span class="pill">${data.timeframe.toUpperCase()}</span>
        <span class="pill">${data.dataset}</span>
        <span class="pill">${fmt.num(data.totalStrategies)} strategies</span>
      `;

      const labels = ["Strategies", "Best Test Return", "Best Train Return", "Best Trades", "Best Score"];
      const values = [
        [fmt.num(data.totalStrategies), ""],
        [fmt.pct(best.test.returnPct), classFor(best.test.returnPct)],
        [fmt.pct(best.train.returnPct), classFor(best.train.returnPct)],
        [fmt.num(best.test.trades), ""],
        [fmt.dec(best.score, 5), ""],
      ];
      els.summary.innerHTML = labels.map((label, i) =>
        metricCard(label, values[i][0], values[i][1], metricIcons[i])
      ).join("");

      const rows = data.top.map((s) => `
        <tr>
          <td>#${s.rank}</td>
          <td>
            <div class="strategy-id">${s.id}</div>
            ${directionBadge(s.direction)}
          </td>
          <td class="signals">${s.signals}</td>
          <td>${fmt.pct(s.train.returnPct)}</td>
          <td>${fmt.dec(s.train.sharpe)}</td>
          <td>${s.train.trades}</td>
          <td>${fmt.pct(s.test.returnPct)}</td>
          <td>${fmt.dec(s.test.sharpe)}</td>
          <td>${s.test.trades}</td>
          <td>
            <div class="export-actions">
              <button class="action-btn doc-export" data-strategy-id="${s.id}" title="Download PDF">PDF</button>
              <button class="action-btn code code-export" data-strategy-id="${s.id}" title="Download Python bot">Code</button>
            </div>
          </td>
        </tr>
      `).join("");

      els.report.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Strategy</th>
                <th>Signals</th>
                <th>Train Return</th>
                <th>Train Sharpe</th>
                <th>Train Trades</th>
                <th>Test Return</th>
                <th>Test Sharpe</th>
                <th>Test Trades</th>
                <th>Export</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function exportUrl(kind, strategyId) {
      const params = new URLSearchParams({
        symbol: els.symbol.value,
        timeframe: els.timeframe.value,
        dataset: els.dataset.value,
        strategyId,
      });
      return kind === "code" ? `/api/strategy-code?${params}` : `/api/document?${params}`;
    }

    async function init() {
      const response = await fetch("/api/options");
      options = await response.json();
      const initialSymbol = options.symbols.includes("ethusd") ? "ethusd" : options.symbols[0];
      setSelect(els.symbol, options.symbols, initialSymbol);
      updateTimeframes();
      await loadReport();
    }

    els.symbol.addEventListener("change", () => { updateTimeframes(); loadReport(); });
    els.timeframe.addEventListener("change", loadReport);
    els.dataset.addEventListener("change", loadReport);
    els.limit.addEventListener("change", loadReport);

    els.report.addEventListener("click", (event) => {
      const docBtn = event.target.closest(".doc-export");
      const codeBtn = event.target.closest(".code-export");
      if (docBtn) window.location.href = exportUrl("doc", docBtn.dataset.strategyId);
      if (codeBtn) window.location.href = exportUrl("code", codeBtn.dataset.strategyId);
    });

    init().catch((error) => {
      els.status.innerHTML = `<span class="pill">Could not load report</span>`;
      els.report.innerHTML = `<div class="empty">${error.message}</div>`;
    });
  </script>
</body>
</html>
